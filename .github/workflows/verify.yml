name: Verify durable dialogue release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  N2_EXPECT_BACKEND: fallback
jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:consumer
      - run: npm audit --omit=dev --audit-level=low
      - run: npm pack --dry-run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: choihyunsus/n2-mimir
          ref: 9bc52f4c4181455ff541e2abe0d29ded31d2041e
          path: mimir-source
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo +1.98.0 build --release --locked --manifest-path mimir-source/packages/core/Cargo.toml -j 2
      - run: node tests/install-native.cjs mimir-source/packages/core/target/release
      - run: npm test
        env:
          N2_EXPECT_BACKEND: rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mimir-native-${{ runner.os }}
          path: node_modules/n2-mimir/dist/n2-mimir-core.node
          if-no-files-found: error
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir release && npm pack --pack-destination release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-package
          path: release/*.tgz
          if-no-files-found: error
  installed-consumer:
    needs: package
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-package
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mimir-native-${{ runner.os }}
          path: native
      - run: node -e "const fs=require('node:fs');fs.mkdirSync('consumer');fs.writeFileSync('consumer/package.json',JSON.stringify({name:'loom-consumer',version:'1.0.0',private:true}));"
      - run: npm install --no-fund ../release/n2-loom-1.0.0.tgz typescript@5.9.3 @types/node@22.20.5
        working-directory: consumer
      - run: node -e "require('node:fs').cpSync('tests','consumer/node_modules/n2-loom/tests',{recursive:true});"
      - run: node --test --test-timeout=60000 "tests/*.test.cjs"
        working-directory: consumer/node_modules/n2-loom
      - run: npm exec --offline -- tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --esModuleInterop --skipLibCheck false node_modules/n2-loom/tests/consumer.cts node_modules/n2-loom/tests/consumer.mts
        working-directory: consumer
      - run: npm exec --offline -- n2-loom help
        working-directory: consumer
      - run: node --input-type=module -e "import {Loom} from 'n2-loom';const provider={id:'fixture',version:'1',model:'fixture',local:true,async generate(){return {text:'hello',calls:[],stop:'complete',model:'fixture',usage:{inputTokens:null,outputTokens:null,cachedInputTokens:null}};}};const engine=new Loom({dbPath:'esm.db',project:'esm',agent:'reader',provider});try{const result=await engine.run({runId:'one',conversationId:'one',message:'hello'});if(!result.success)throw new Error(result.error);}finally{await engine.close();}"
        working-directory: consumer
      - run: node consumer/node_modules/n2-loom/tests/install-native.cjs native
      - run: node --test --test-timeout=60000 "tests/*.test.cjs"
        working-directory: consumer/node_modules/n2-loom
        env:
          N2_EXPECT_BACKEND: rust
      - run: npm audit --omit=dev --audit-level=low
        working-directory: consumer
